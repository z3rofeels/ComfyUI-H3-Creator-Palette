[project]
name = "zf-h3-creator-palette"
version = "3.14.1"
description = "A local MiniMax H3 creation workspace for ComfyUI with visual prompt authoring, Cast, references, timeline direction, LoRAs, PreStage, sampling, and output tools."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
authors = [{ name = "z3rofeels" }]
keywords = [
  "comfyui",
  "minimax",
  "h3",
  "video",
  "creator-palette",
  "prompt-editor",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/z3rofeels/ComfyUI-H3-Creator-Palette"
Documentation = "https://github.com/z3rofeels/ComfyUI-H3-Creator-Palette#readme"
"Bug Tracker" = "https://github.com/z3rofeels/ComfyUI-H3-Creator-Palette/issues"
"Prompt Palette" = "https://github.com/z3rofeels/comfyui-promptpalette"

[tool.comfy]
PublisherId = "z3rofeels"
DisplayName = "H3 Creator Palette"
Icon = "https://raw.githubusercontent.com/z3rofeels/ComfyUI-H3-Creator-Palette/main/assets/zf-h3-creator-palette-icon.png"
Banner = "https://raw.githubusercontent.com/z3rofeels/ComfyUI-H3-Creator-Palette/main/assets/zf-h3-creator-palette-banner.png"
requires-comfyui = ">=0.34.0"
